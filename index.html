<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>DINOVERSE</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- ===================== MAIN (no gate — land here directly) ===================== -->
  <main id="app" class="app">
    <header class="topbar">
      <span class="wordmark" id="site-title">DINOVERSE</span>
    </header>

    <!-- Hero (vertical) -->
    <section class="hero">
      <h1 class="hero-title display">
        <span class="line" data-split>WE BUILD UNIVERSES</span>
        <span class="line accent" data-split>NO ONE SAW COMING.</span>
      </h1>
      <p class="hero-sub" id="hero-sub">DIVERSE TOOLS. NO EXTINCTION.</p>
      <a class="scroll-cue" href="#hscroll" aria-label="아래로 스크롤">
        <span class="scroll-cue-label">SCROLL</span>
        <span class="scroll-cue-arrow" aria-hidden="true">↓</span>
      </a>
    </section>

    <!-- Horizontal gallery (mixed scroll direction) -->
    <section class="hscroll" id="hscroll">
      <div class="hsticky">
        <div class="htrack" id="htrack">
          <article class="panel intro-panel">
            <h2 class="intro-big display" data-split>APPS</h2>
            <p class="intro-note">→ 옆으로 스크롤해서<br />앱을 둘러보세요</p>
          </article>
          <!-- app panels injected here -->
        </div>
      </div>
    </section>

    <footer class="footer">
      <blockquote class="footer-verse display">
        <span class="line" data-split>I CAN DO ALL THINGS</span>
        <span class="line" data-split>THROUGH CHRIST</span>
        <span class="line" data-split>WHO STRENGTHENS ME.</span>
      </blockquote>
      <cite class="footer-ref">— PHILIPPIANS 4:13</cite>
      <span class="studio-sticker">SURVIVING-DINOS-STUDIO</span>
    </footer>
  </main>

  <!-- App panel template -->
  <template id="panel-tpl">
    <article class="panel">
      <div class="panel-badge">
        <img class="panel-sticker" alt="" />
        <span class="panel-num">
          <img class="panel-icon" alt="" />
          <span class="panel-index"></span>
        </span>
      </div>
      <div class="panel-content">
        <div class="panel-meta"></div>
        <h2 class="panel-name display"></h2>
        <p class="panel-desc"></p>
        <div class="panel-action">
          <button class="unlock-btn link-btn">[ UNLOCK ]</button>
          <form class="app-pw line-form hidden" autocomplete="off">
            <input type="password" class="app-pw-input line-input" placeholder="APP CODE" autocomplete="off" />
            <button type="submit" class="arrow-btn" aria-label="enter">→</button>
            <span class="err app-error"></span>
          </form>
          <div class="files hidden"></div>
        </div>
      </div>
    </article>
  </template>

  <script src="assets/vendor/lenis.min.js"></script>
  <script src="assets/crypto.js"></script>
  <script src="data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
