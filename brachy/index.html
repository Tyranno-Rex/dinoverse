<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- GitHub Pages serves assets with cache-control: max-age=600, so a deploy
       is invisible for ten minutes unless the URL changes. Bump ?v= below
       whenever anything under assets/ changes. -->
  <title>BRACHY CALENDAR — DINOVERSE</title>
  <link rel="icon" href="../image/brachy-icon.png" />
  <link rel="preload" href="assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="assets/style.css?v=12" />
</head>
<body>
  <!-- ============ LOADER — black, and something being typed ============
       No progress bar, no logo, and no month drawing itself: the page opens
       the way a plain text file opens, on black, with lines written a
       character at a time. What it writes is the visitor's own date, so the
       first thing this page says is already true of them before it has asked
       for anything — and it hands over to a wall of a hundred features, which
       is the loudest screen on the site. Quiet first. -->
  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-lines" id="boot-lines"></div>
  </div>

  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <header class="topbar">
    <a class="topbar-back" href="../">← DINOVERSE</a>
    <span class="topbar-name">BRACHY CALENDAR</span>
    <a class="topbar-get" href="#get">[ GET ]</a>
  </header>

  <h1 class="sr-only">Brachy Calendar — a desktop calendar that is your wallpaper</h1>

  <!-- ============ 1. THE WALL — everything it does, then where it lives ====
       The first screen is the whole feature list at once, set on a wallpaper.
       The words are the product's, counted rather than claimed: the eyebrow
       reads its numbers off the same array the wall is built from, so the
       count cannot drift from the list.

       Scroll scatters them — the small ones first — and what is left standing
       in the cleared middle is the calendar itself, with no window around it.
       That transition IS the demonstration of desktop mode; the tour does not
       spend a step on it. -->
  <section class="wall" id="wall">
    <div class="wall-pin">
      <div class="plane plane--wall" id="plane-wall" aria-hidden="true"></div>

      <!-- the shortcuts sit inside the block rather than beside it, so they pan
           and scatter with everything else -->
      <div class="wall-words" id="wall-words" aria-hidden="true">
        <div class="wall-keys" id="wall-keys"></div>
      </div>

      <div class="plane plane--cal" id="plane-cal"></div>

      <div class="wall-copy" id="wall-copy">
        <p class="eyebrow" id="wall-eyebrow"></p>
        <h2 class="wall-title" id="wall-title">All of it, at once.</h2>
        <p class="wall-lead" id="wall-lead"></p>
      </div>

      <a class="scroll-cue" href="#tour">
        <span id="cue-label">SCROLL</span><span class="scroll-cue-arrow" aria-hidden="true">↓</span>
      </a>
      <a class="wall-skip" href="#get">[ SKIP TO DOWNLOAD ]</a>
    </div>
  </section>

  <!-- ============ 2. THE TOUR — it uses itself ============
       The wall leaves our calendar standing on the desktop. This section picks
       it up and works it: a pointer writes an event with QuickAdd, drags it,
       plans the day, filters the month down to one project, decorates it,
       syncs it to a second device, and finally steps away and lets an agent
       put one in.

       Every step is the app's own UI doing the thing — QuickAdd is QuickAdd.tsx,
       the planner is DailyPlanner.tsx, the filter bar is TagFilterBar.tsx, the
       stickers are FreeStickerItem.tsx, and the pill that lands is drawn by the
       same markup as every other pill on the grid.

       Two steps have no UI of their own to show: desktop mode is something the
       OS does, and MCP is a socket. Neither is drawn as a fake screen — the
       first is the real calendar standing on a real wallpaper, and the second
       is the real pill arriving with no hand on it, narrated in the PAGE's own
       type rather than in a window the app does not have.

       Scroll moves between steps; arriving at one plays it. Nothing here is a
       video and nothing is a mock-up: the DOM really changes, which is why
       scrolling back has to put it all the way back. -->
  <section class="tour" id="tour">
    <div class="tour-pin">
      <div class="tour-stage" id="tour-stage"></div>

      <!-- the second device, for the step where two of them agree -->
      <div class="tour-mirror" id="tour-mirror" aria-hidden="true">
        <p class="tour-mirror-label">ANOTHER DEVICE</p>
        <div class="tour-mirror-stage" id="tour-mirror-stage"></div>
      </div>

      <!-- the app's own side panel, when a step opens a day -->
      <aside class="tour-panel" id="tour-panel" aria-hidden="true">
        <div class="app dark blue">
          <div class="schedule-header">
            <div class="schedule-header-content">
              <h2 class="schedule-title">Schedule</h2>
              <p class="schedule-date" id="tour-panel-when"></p>
            </div>
            <span class="schedule-close">×</span>
          </div>
          <div class="schedule-list" id="tour-panel-list"></div>
        </div>
      </aside>

      <!-- QuickAdd, and the daily planner: both are windows the app opens over
           the month rather than beside it, so they sit on the stage -->
      <div class="tour-quick" id="tour-quick" aria-hidden="true"></div>
      <div class="tour-planner" id="tour-planner" aria-hidden="true"></div>

      <!-- the mood sticker picker hangs off the day it was opened on -->
      <div class="tour-mood" id="tour-mood" aria-hidden="true"></div>

      <!-- MCP has no window. What the agent asked for is said in the PAGE's
           type, outside the app's frame, so nothing here can be mistaken for
           a screen the product has. -->
      <div class="tour-agent" id="tour-agent" aria-hidden="true"></div>

      <span class="demo-ptr" id="tour-ptr" aria-hidden="true">
        <svg width="17" height="20" viewBox="0 0 17 20" fill="#fff" stroke="#0b0e11"
             stroke-width="1.1" stroke-linejoin="round">
          <path d="M1 1 1 15.4 5 11.6 7.8 17.8 10.6 16.5 7.9 10.5 12.9 10.2Z" />
        </svg>
      </span>

      <div class="tour-copy" id="tour-copy">
        <p class="eyebrow"><span id="tour-n">01 / 07</span><span class="tour-tier" id="tour-tier"></span></p>
        <h2 class="tour-title" id="tour-title"></h2>
        <p class="tour-lead" id="tour-lead"></p>
      </div>

      <ol class="tour-rail" id="tour-rail" aria-hidden="true"></ol>
    </div>
  </section>

  <!-- ============ 3. GET — the page ends quiet ============ -->
  <section class="get" id="get">
    <div class="get-inner">
      <img class="get-stamp" src="../image/brachy-mascot.png" alt="" />
      <h2 class="display get-title">BRACHY<br />CALENDAR</h2>
      <p class="get-meta" id="get-meta">VERSION — · WINDOWS</p>
      <div class="get-action">
        <button class="unlock-btn link-btn" id="unlock-btn">[ UNLOCK WITH APP CODE ]</button>
        <form class="line-form hidden" id="pw-form" autocomplete="off">
          <input type="password" class="line-input" id="pw-input" placeholder="APP CODE" autocomplete="off" />
          <button type="submit" class="arrow-btn" aria-label="enter">→</button>
        </form>
        <p class="err" id="pw-err"></p>
        <div class="files hidden" id="files"></div>
      </div>
    </div>
    <footer class="footer">
      <span>SURVIVING DINOS STUDIO</span>
      <a href="../">DINOVERSE ↗</a>
    </footer>
  </section>

  <script src="../assets/vendor/lenis.min.js"></script>
  <script src="../assets/crypto.js"></script>
  <script src="../data.js"></script>
  <script src="assets/app.js?v=12"></script>
</body>
</html>
